minimumReleaseAge: 0

# Every v4 vitest resolves to one exact version, so the chai plugin
# registration never mixes vitest subpackage versions.
overrides:
    'vitest@>=4': 4.1.10
    # The organize-imports plugin drives the typescript JS api, which the
    # native typescript 7 package doesn't provide, so it keeps its own 5.x.
    'prettier-plugin-organize-imports>typescript': ^5.8.2

strictPeerDependencies: false
gitChecks: false

packages:
    - 'packages/*'

allowBuilds:
    '@swc/core': true
    aws-crt: false
    aws-sdk: false
    core-js: false
    esbuild: false
    msgpackr-extract: false
    protobufjs: false
    redis-memory-server: false
    sharp: false
    stay-awake: false
    svelte-preprocess: false
