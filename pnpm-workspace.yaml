minimumReleaseAge: 8640
minimumReleaseAgeExclude:
    - '@types/bun'
    - '@awsless/*'
    - '@terraforge/*'
    - typescript
    - rolldown
    - '@oxc-project/*'
    - '@rolldown/*'
    - '@napi-rs/*'
    - '@emnapi/*'

# Every v4 vitest resolves to one exact version, so the chai plugin
# registration never mixes vitest subpackage versions.
overrides:
    'vitest@>=4': 4.1.10

strictPeerDependencies: false
gitChecks: false

packages:
    - 'packages/*'

allowBuilds:
    '@swc/core': true
    aws-crt: false
    aws-sdk: false
    core-js: false
    esbuild: false
    msgpackr-extract: false
    protobufjs: false
    redis-memory-server: false
    sharp: false
    stay-awake: false
    svelte-preprocess: false
