minimumReleaseAge: 0

# pnpm add saves exact versions - no ^ ranges.
savePrefix: ''
saveWorkspaceProtocol: rolling
resolvePeersFromWorkspaceRoot: true
enablePrePostScripts: true
updateNotifier: false

overrides:
    # Other dependencies uses older verions
    '@types/node': 26.2.0
    # @terraforge/core pins an ancient client-dynamodb whose smithy v1
    # chain wins the hoist fallback - lift it until terraforge bumps.
    '@aws-sdk/client-dynamodb@3.363.0': 3.1113.0

strictPeerDependencies: false
gitChecks: false

packages:
    - 'packages/*'

allowBuilds:
    aws-crt: false
    aws-sdk: false
    core-js: false
    esbuild: false
    msgpackr-extract: false
    protobufjs: false
    redis-memory-server: false
    sharp: false
    stay-awake: false
    svelte-preprocess: false
