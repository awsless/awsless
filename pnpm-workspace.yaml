minimumReleaseAge: 0

# pnpm add saves exact versions - no ^ ranges.
savePrefix: ''
saveWorkspaceProtocol: rolling
resolvePeersFromWorkspaceRoot: true
enablePrePostScripts: true
updateNotifier: false

overrides:
    # Other dependencies uses older verions
    '@types/node': 26.2.0
    # @terraforge/core pins an ancient client-dynamodb whose smithy v1
    # chain wins the hoist fallback - lift it until terraforge bumps.
    '@aws-sdk/client-dynamodb@3.363.0': 3.1164.0

strictPeerDependencies: false
gitChecks: false

packages:
    - 'packages/*'

allowBuilds:
    # Their install script only links library files, which
    # @awsless/postgres-server does itself when it starts.
    '@embedded-postgres/darwin-arm64': false
    '@embedded-postgres/darwin-x64': false
    '@embedded-postgres/linux-arm': false
    '@embedded-postgres/linux-arm64': false
    '@embedded-postgres/linux-ia32': false
    '@embedded-postgres/linux-ppc64': false
    '@embedded-postgres/linux-x64': false
    '@embedded-postgres/windows-x64': false
    aws-crt: false
    aws-sdk: false
    core-js: false
    esbuild: false
    msgpackr-extract: false
    protobufjs: false
    redis-memory-server: false
    sharp: false
    stay-awake: false
    svelte-preprocess: false
