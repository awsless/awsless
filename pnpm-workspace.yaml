minimumReleaseAge: 0

# Every v4 vitest resolves to one exact version, so the chai plugin
# registration never mixes vitest subpackage versions.
overrides:
    'vitest@>=4': 4.1.11
    # One @types/node for the whole graph, so peer-splits can't create
    # two vitest instances that share no internal state.
    '@types/node': 26.2.0

strictPeerDependencies: false
gitChecks: false

packages:
    - 'packages/*'

allowBuilds:
    '@swc/core': true
    aws-crt: false
    aws-sdk: false
    core-js: false
    esbuild: false
    msgpackr-extract: false
    protobufjs: false
    redis-memory-server: false
    sharp: false
    stay-awake: false
    svelte-preprocess: false
